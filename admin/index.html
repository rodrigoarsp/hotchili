<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Chili — CMS Headless &amp; Admin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Tailwind CDN com Configuração Customizada Dark Luxury -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#efbf62',
                        'primary-dark': '#d4a445',
                        'primary-container': '#7b5800',
                        'on-primary': '#201600',
                        surface: '#0f0f10',
                        'surface-card': '#17171a',
                        'surface-hover': '#212126',
                        'surface-border': '#2d2d34',
                        'on-surface': '#f4f4f5',
                        'on-surface-muted': '#9ca3af',
                    },
                    fontFamily: {
                        display: ['Cinzel', 'serif'],
                        editorial: ['Playfair Display', 'serif'],
                        body: ['Hanken Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0f10;
            color: #f4f4f5;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #17171a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d2d34;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #efbf62;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased selection:bg-primary selection:text-on-primary">
    <div id="root"></div>

    <!-- Aplicação Nativa ES Module Ultra-rápida (Compatibilidade Total com cPanel) -->
    <script type="module" src="js/admin-app.js?v=2.6.0"></script>
</body>
</html>
